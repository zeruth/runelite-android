name: CI

on: [ push, pull_request ]

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    env:
      GRADLE_OPTS: "-Dfile:encoding=UTF-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache glslang
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/runelite
          key: ${{ runner.os }}-cache-${{ hashFiles('ci/build.sh') }}
          restore-keys: |
            ${{ runner.os }}-cache-

      # Plugin Hub jars for ci/build.sh's hub-compat gate. Jars are keyed by hash in the
      # cache, so a run-unique key saves the union and the newest save restores.
      - name: Cache Plugin Hub jars
        uses: actions/cache@v5
        with:
          path: build/hub-cache
          key: ${{ runner.os }}-hub-cache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-hub-cache-

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      # The runner image's preinstalled NDK doesn't match android-awt's pinned ndkVersion,
      # and rust-android-gradle checks for it at configure time (before AGP could
      # auto-download), failing with "NDK is not installed". Install the pinned one.
      - name: Install Android NDK
        run: |
          NDK_VERSION=$(sed -n 's/^\s*ndkVersion\s*=\s*"\(.*\)"/\1/p' android-awt/build.gradle.kts)
          test -n "$NDK_VERSION"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust Android targets
        run: |
          rustup target add \
            armv7-linux-androideabi \
            aarch64-linux-android \
            x86_64-linux-android \
            i686-linux-android

      - name: Write release version
        run: ./gradlew :android:writeReleaseVersion --console=plain

      - name: Resolve release version
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(python3 -c 'import json; print(json.load(open("android/build/release-version.json"))["tag"])')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; skipping publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # The release build type falls back to the debug key when no keystore is configured,
      # and SignatureGuard refuses to boot anything not signed with the production cert —
      # so refuse to publish rather than ship an APK that can't start. Non-publishing runs
      # build the same release APK debug-signed.
      - name: Configure release signing
        if: steps.version.outputs.publish == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::secret for $v is not set"; exit 1; fi
          done
          KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          {
            echo "runeliteMp.signing.storeFile=$KEYSTORE"
            echo "runeliteMp.signing.storePassword=$KEYSTORE_PASSWORD"
            echo "runeliteMp.signing.keyAlias=$KEY_ALIAS"
            echo "runeliteMp.signing.keyPassword=$KEY_PASSWORD"
          } >> local.properties

      - name: Build release APK
        run: ./ci/build.sh

      # Uploaded on failure too: a failing gate is when baseline-proposed.json is needed.
      - name: Upload hub compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hub-compat-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            build/hub-compat/report.md
            build/hub-compat/report.json
            build/hub-compat/baseline-proposed.json
          if-no-files-found: ignore

      - name: Verify release version
        run: |
          python3 -m unittest discover -s ci -p 'test_release_version.py'
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n1)
          python3 ci/verify_release_version.py \
            --metadata android/build/release-version.json \
            --apk android/build/outputs/apk/release/android-release.apk \
            --build-config android/build/generated/source/buildConfig/release/net/runelite/mp/BuildConfig.java \
            --aapt "$AAPT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: runelite-android-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            android/build/outputs/apk/release/*.apk

      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          APK=$(find android/build/outputs/apk/release -name '*.apk' | head -n1)
          test -n "$APK"
          mv "$APK" "runelite-android_$TAG.apk"
          gh release create "$TAG" "runelite-android_$TAG.apk" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
