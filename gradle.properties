org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Xmx8g -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=false

# Kotlin runs in its own daemon and shares heap with d8/r8 if unset — give it
# dedicated headroom so a big mp compileKotlinAndroid doesn't push the dexer to disk.
kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m

project.build.group=net.runelite
project.build.version=1.13.1

glslang.path=

# runelite-mp / Android target
android.useAndroidX=true
# Run R8 in ProGuard-compat mode rather than its more aggressive "full mode"
# default. Full mode does extra optimizations (class merging, return value
# propagation, member inlining) that erase generic Signature metadata on @Inject
# constructor parameters, which then crashes Guice's Key.canonicalizeForKey
# with ClassCastException at injector creation. Compat mode is closer to
# stock ProGuard semantics and preserves enough metadata for Guice / Gson /
# TypeLiteral reflection to work.
android.enableR8.fullMode=false

# rust-android-gradle 0.10.0 still codes against the pre-9 DSL (it asks for LibraryExtension);
# AGP 9 keeps the old DSL available behind this flag until AGP 10. Drop it once the cargo plugin
# supports the new DSL.
android.newDsl=false
